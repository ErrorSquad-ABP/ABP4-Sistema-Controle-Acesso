name: ci-mobile

on:
  pull_request:
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-mobile.yml'
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Ate o esqueleto Flutter (US-09) existir, o job passa avisando que nao ha o que checar.
      - name: Detectar projeto Flutter
        id: detect
        working-directory: .
        run: |
          if [ -f mobile/pubspec.yaml ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=ci-mobile::mobile/pubspec.yaml ainda nao existe (US-09) - analyze/test pulados."
          fi

      - uses: subosito/flutter-action@v2
        if: steps.detect.outputs.exists == 'true'
        with:
          channel: stable
          cache: true

      - name: Instalar dependencias
        if: steps.detect.outputs.exists == 'true'
        run: flutter pub get

      - name: Analyze
        if: steps.detect.outputs.exists == 'true'
        run: flutter analyze

      - name: Testes
        if: steps.detect.outputs.exists == 'true'
        run: flutter test
