[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32@6.10.0
board = esp32dev
framework = arduino
monitor_speed = 115200
; ESP32Servo 3.1+ exige Arduino-ESP32 3.x; o platform espressif32 6.x traz o core 2.0.17.
lib_deps =
    knolleary/PubSubClient@2.8
    madhephaestus/ESP32Servo@3.0.9
    bblanchon/ArduinoJson@7.4.3
    adafruit/Adafruit ILI9341@1.7.0
    adafruit/Adafruit GFX Library@1.13.0
    ricmoo/QRCode@0.0.1
