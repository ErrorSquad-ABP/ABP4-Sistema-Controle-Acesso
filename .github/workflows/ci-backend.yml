name: ci-backend

on:
  # Em PR roda sempre: os checks sao obrigatorios na main.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  check:
    name: ci-backend-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Postgres efemero do job: valida migration e seed, que o build sozinho nao cobre.
      DATABASE_URL: postgresql://abp4:abp4@localhost:5432/abp4?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: abp4
          POSTGRES_PASSWORD: abp4
          POSTGRES_DB: abp4
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U abp4"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar Prisma Client
        run: npm run db:generate

      - name: Validar schema Prisma
        run: npx prisma validate

      - name: Aplicar migration no Postgres do job
        run: npm run db:migrate:deploy

      - name: Seed idempotente (roda duas vezes)
        run: npm run db:seed && npm run db:seed

      - name: Seed demo recusa producao e banco remoto (DT-07)
        run: |
          if NODE_ENV=production npm run db:seed:run; then echo "seed rodou em producao"; exit 1; fi
          if DATABASE_URL=postgresql://u:p@ep-x.neon.tech/db npm run db:seed:run; then echo "seed rodou em banco remoto"; exit 1; fi

      - name: Provisionamento do administrador (idempotente)
        env:
          ADMIN_EMAIL: admin@empresa.example
          ADMIN_PASSWORD: senha-de-ci-0123456789
        run: npm run db:provision && npm run db:provision

      - name: Lint (inclui regra de camadas)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes (Vitest + cobertura)
        run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=json-summary

      - name: Resumo da cobertura
        if: always() && hashFiles('backend/coverage/coverage-summary.json') != ''
        run: |
          # As crases sao template literals do JS, nao expansao do shell.
          # shellcheck disable=SC2016
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Cobertura do backend", "", "| Metrica | % | Cobertos |", "|---|---|---|",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

      - name: E2E (PostgreSQL temporario + broker MQTT + API e worker separados)
        # O build ja foi executado acima; o script local test:e2e tambem inclui build.
        run: npx vitest run --config vitest.e2e.config.ts

  docker:
    name: ci-backend-docker
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          load: true
          tags: abp4-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Smoke test do container (/health)
        working-directory: .
        run: |
          qr_token_secret="$(openssl rand -hex 32)"
          docker run -d --name api -p 3000:3000 \
            -e APP_VERSION="${GITHUB_SHA::7}" \
            -e QR_TOKEN_SECRET="$qr_token_secret" \
            -e JWT_SECRET="$(openssl rand -hex 32)" \
            abp4-backend:ci
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
