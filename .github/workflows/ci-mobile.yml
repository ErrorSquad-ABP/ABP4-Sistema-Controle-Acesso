name: ci-mobile

on:
  # Em PR roda sempre: os checks sao obrigatorios na main.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'mobile/**'
      - '.github/workflows/ci-mobile.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: mobile

jobs:
  check:
    name: ci-mobile-check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Testes
        run: flutter test

  # DT-10: widgets verdes nao comprovam empacotamento Android. Gera o APK release,
  # confere o pacote e publica o artefato; qualquer falha de Gradle/empacotamento
  # derruba o job. Assinado com a chave debug (ainda nao ha keystore de release),
  # portanto instalavel em aparelho, mas nao distribuivel em loja.
  build-android:
    name: ci-mobile-build-android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Instalar dependencias
        run: flutter pub get

      # versionCode unico por execucao permite instalar um APK sobre o anterior.
      - name: Build APK (release)
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: Conferir pacote (assinatura, identidade, permissoes, ABI)
        run: bash tool/ci/verify_apk.sh build/app/outputs/flutter-apk/app-release.apk

      - name: Nomear artefato
        run: |
          mkdir -p build/ci
          cp build/app/outputs/flutter-apk/app-release.apk "build/ci/controle-acesso-${GITHUB_SHA::7}.apk"

      - uses: actions/upload-artifact@v7
        with:
          name: controle-acesso-apk
          path: mobile/build/ci/*.apk
          if-no-files-found: error
          retention-days: 14

  # Aparelho de referencia do CI: emulador Pixel 6, Android 14 (API 34, x86_64).
  # Prova que o APK instala e abre; camera/GPS em hardware real seguem na DT-12.
  install-android:
    name: ci-mobile-install-android
    needs: build-android
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          name: controle-acesso-apk
          path: apk

      - name: Habilitar KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instalar e abrir no emulador
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash mobile/tool/ci/android_install_smoke.sh "$(ls apk/*.apk)"
