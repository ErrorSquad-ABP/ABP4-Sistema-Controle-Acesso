name: ci-firmware

on:
  # Em PR roda sempre: os checks sao obrigatorios na main.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/ci-firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: firmware

jobs:
  build:
    name: ci-firmware-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Instalar PlatformIO
        run: pip install platformio==6.1.18

      # Os testes host do modulo MQTT usam o ArduinoJson real, resolvido pelo LDF.
      - name: Baixar dependencias do firmware
        run: pio pkg install -e esp32dev

      - name: Testes host (logica pura)
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I include tests/test_retry.cpp -o "$RUNNER_TEMP/abp4-test-retry"
          "$RUNNER_TEMP/abp4-test-retry"
          g++ -std=c++11 -Wall -Wextra -Werror -I include tests/test_door_machine.cpp -o "$RUNNER_TEMP/abp4-test-door"
          "$RUNNER_TEMP/abp4-test-door"
          g++ -std=c++11 -Wall -Wextra -Werror -I include tests/test_command.cpp -o "$RUNNER_TEMP/abp4-test-command"
          "$RUNNER_TEMP/abp4-test-command"
          g++ -std=c++11 -Wall -Wextra -Werror -I include tests/test_feedback_pattern.cpp -o "$RUNNER_TEMP/abp4-test-feedback"
          "$RUNNER_TEMP/abp4-test-feedback"
          g++ -std=c++11 -Wall -Wextra -Werror -I include tests/test_display_text.cpp -o "$RUNNER_TEMP/abp4-test-display"
          "$RUNNER_TEMP/abp4-test-display"
          g++ -std=c++11 -Wall -Wextra -Werror -I include tests/test_display_layout.cpp -o "$RUNNER_TEMP/abp4-test-layout"
          "$RUNNER_TEMP/abp4-test-layout"
          g++ -std=c++11 -Wall -Wextra -Werror -I include tests/test_qr_token.cpp -o "$RUNNER_TEMP/abp4-test-qr"
          "$RUNNER_TEMP/abp4-test-qr"
          g++ -std=c++11 -Wall -Wextra -Werror -I include tests/test_qr_version.cpp -o "$RUNNER_TEMP/abp4-test-qr-version"
          "$RUNNER_TEMP/abp4-test-qr-version"
          # DT-19: o token do QR precisa caber inteiro na versao 8 do encoder real.
          # A lib de terceiros nao compila com -Werror; so o teste nosso exige.
          gcc -std=c99 -O2 -I .pio/libdeps/esp32dev/QRCode/src \
            -c .pio/libdeps/esp32dev/QRCode/src/qrcode.c -o "$RUNNER_TEMP/qrcode.o"
          g++ -std=c++11 -Wall -Wextra -Werror -I include -I .pio/libdeps/esp32dev/QRCode/src \
            tests/test_display_qr.cpp "$RUNNER_TEMP/qrcode.o" -o "$RUNNER_TEMP/abp4-test-display-qr"
          "$RUNNER_TEMP/abp4-test-display-qr"
          g++ -std=c++11 -Wall -Wextra -Werror -I include tests/test_clock_policy.cpp -o "$RUNNER_TEMP/abp4-test-clock"
          "$RUNNER_TEMP/abp4-test-clock"
          g++ -std=c++11 -Wall -Wextra -Werror -I include tests/test_nfc_scan.cpp -o "$RUNNER_TEMP/abp4-test-nfc"
          "$RUNNER_TEMP/abp4-test-nfc"
          g++ -std=c++11 -Wall -Wextra -Werror -I tests/fakes -I include -I src tests/test_nfc.cpp src/modules/nfc.cpp -o "$RUNNER_TEMP/abp4-test-nfc-module"
          "$RUNNER_TEMP/abp4-test-nfc-module"
          "$RUNNER_TEMP/abp4-test-nfc-module" missing-reader
          g++ -std=c++11 -Wall -Wextra -Werror -I tests/fakes -I include -I src tests/test_feedback_io.cpp src/modules/feedback.cpp -o "$RUNNER_TEMP/abp4-test-feedback-physical"
          "$RUNNER_TEMP/abp4-test-feedback-physical"
          g++ -std=c++11 -Wall -Wextra -Werror -D TERMINAL_LEGACY_TFT=1 -I tests/fakes -I include -I src tests/test_feedback_io.cpp src/modules/feedback.cpp -o "$RUNNER_TEMP/abp4-test-feedback-wokwi"
          "$RUNNER_TEMP/abp4-test-feedback-wokwi"

      - name: Testes host (modulo MQTT com broker simulado)
        run: |
          JSON_SRC=.pio/libdeps/esp32dev/ArduinoJson/src
          g++ -std=c++11 -Wall -Wextra -Werror -I tests/fakes -I include -I src -isystem "$JSON_SRC" tests/test_mqtt.cpp src/modules/mqtt.cpp -o "$RUNNER_TEMP/abp4-test-mqtt"
          "$RUNNER_TEMP/abp4-test-mqtt"
          g++ -std=c++11 -Wall -Wextra -Werror -I tests/fakes -I include -I src -isystem "$JSON_SRC" tests/test_mqtt_command.cpp src/modules/mqtt.cpp -o "$RUNNER_TEMP/abp4-test-mqtt-command"
          "$RUNNER_TEMP/abp4-test-mqtt-command"
          g++ -std=c++11 -Wall -Wextra -Werror -I tests/fakes -I include -I src -isystem "$JSON_SRC" tests/test_mqtt_nfc.cpp src/modules/mqtt.cpp -o "$RUNNER_TEMP/abp4-test-mqtt-nfc"
          "$RUNNER_TEMP/abp4-test-mqtt-nfc"

      # DT-06: TLS ligado, com o fake de tests/fakes antes de include/ (o mqtt_ca.h de teste
      # substitui o PEM real).
      - name: Testes host (MQTT com TLS)
        run: |
          JSON_SRC=.pio/libdeps/esp32dev/ArduinoJson/src
          g++ -std=c++11 -Wall -Wextra -Werror -DMQTT_USE_TLS=1 -I tests/fakes -I include -I src -isystem "$JSON_SRC" tests/test_mqtt_tls.cpp src/modules/mqtt.cpp -o "$RUNNER_TEMP/abp4-test-mqtt-tls"
          "$RUNNER_TEMP/abp4-test-mqtt-tls"

      - name: Testes host (reconexao durante ciclo da porta)
        run: |
          JSON_SRC=.pio/libdeps/esp32dev/ArduinoJson/src
          for tls in 0 1; do
            g++ -std=c++11 -Wall -Wextra -Werror -DTERMINAL_LEGACY_TFT=1 -DMQTT_USE_TLS=$tls -I tests/fakes -I include -I src -isystem "$JSON_SRC" tests/test_mqtt_door_timing.cpp src/main.cpp src/modules/mqtt.cpp src/modules/door.cpp -o "$RUNNER_TEMP/abp4-test-mqtt-door"
            for phase in opening open closing puback; do
              "$RUNNER_TEMP/abp4-test-mqtt-door" "$phase"
            done
          done

      # setInsecure() aceita qualquer certificado: nao pode existir no firmware.
      - name: Proibir setInsecure no firmware
        run: |
          if grep -rn "setInsecure" src include; then
            echo "setInsecure() desliga a validacao do certificado (DT-06)" >&2
            exit 1
          fi

      # config.h tem segredos (WiFi/broker) e nao e versionado; no CI compila com o exemplo.
      - name: Preparar config.h a partir do exemplo
        run: cp include/config.example.h include/config.h

      - name: Build
        run: pio run -e esp32dev -e esp32dev-wokwi

      # DT-06: o caminho de producao (WiFiClientSecure + CA embutido) tambem precisa compilar.
      - name: Build com TLS
        run: pio run -e esp32dev
        env:
          PLATFORMIO_BUILD_FLAGS: -DMQTT_USE_TLS=1

      - name: Build legado com TLS
        run: pio run -e esp32dev-wokwi
        env:
          PLATFORMIO_BUILD_FLAGS: -DMQTT_USE_TLS=1 -DTERMINAL_LEGACY_TFT=1

      # DT-06/US-29: a variante OLED (TERMINAL_DISPLAY_OLED=1) precisa compilar.
      - name: Build com TLS e OLED
        run: pio run
        env:
          PLATFORMIO_BUILD_FLAGS: -DMQTT_USE_TLS=1 -DTERMINAL_DISPLAY_OLED=1
