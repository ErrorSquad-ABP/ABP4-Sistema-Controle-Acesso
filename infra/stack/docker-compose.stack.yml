# Stack local completa (API + worker + Postgres) contra o EMQX Cloud.
# Uso: docker compose -f docker-compose.stack.yml --env-file .env.stack up
name: abp4-stack

x-backend: &backend
  image: node:24
  working_dir: /app/backend
  env_file: .env.stack
  environment: &backend-env
    NODE_ENV: development
    ACCESS_MODE: real
    PORT: "3000"
    LOG_LEVEL: info
    TRUST_PROXY: "0"
    RELAY_WINDOW_ENABLED: "false"
    DATABASE_URL: postgresql://abp4:abp4@postgres:5432/abp4?schema=public
  volumes:
    - ../..:/app
    - stack-node-modules:/app/backend/node_modules

services:
  postgres:
    image: postgres:17-alpine
    environment: { POSTGRES_USER: abp4, POSTGRES_PASSWORD: abp4, POSTGRES_DB: abp4 }
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abp4 -d abp4"]
      interval: 3s
      retries: 20

  api:
    <<: *backend
    depends_on: { postgres: { condition: service_healthy } }
    command: bash /app/infra/stack/api.sh
    ports: ["3000:3000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      retries: 100
      start_period: 120s

  worker:
    <<: *backend
    depends_on: { api: { condition: service_healthy } }
    command: npx tsx src/main/mqtt-consumer.ts

  dbsetup:
    image: postgres:17-alpine
    env_file: .env.stack
    depends_on: { api: { condition: service_healthy } }
    volumes: ["./setup.sh:/setup.sh:ro"]
    entrypoint: ["sh", "/setup.sh"]
    restart: "no"

  status:
    image: eclipse-mosquitto:2
    profiles: ["tools"]
    env_file: .env.stack
    volumes:
      - ./publish-status.sh:/publish-status.sh:ro
      - ./emqxsl-ca.crt:/ca.crt:ro
    entrypoint: ["sh", "/publish-status.sh"]

  qrview:
    image: node:24
    profiles: ["tools"]
    env_file: .env.stack
    working_dir: /qr
    volumes:
      - ./qr-viewer.mjs:/qr/qr-viewer.mjs:ro
      - ./emqxsl-ca.crt:/ca.crt:ro
    command: bash -c "npm init -y >/dev/null && npm i -s mqtt@5 qrcode@1 && node qr-viewer.mjs"
    ports: ["8081:8081"]

volumes:
  stack-node-modules:
