name: ci-backend

on:
  pull_request:
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/ci-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: backend

jobs:
  check:
    name: lint + typecheck + test + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint (inclui regra de camadas)
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes (Vitest + cobertura)
        run: npm run test:coverage -- --coverage.reporter=text --coverage.reporter=json-summary

      - name: Resumo da cobertura
        if: always() && hashFiles('backend/coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const t = require("./coverage/coverage-summary.json").total;
            const row = (k) => `| ${k} | ${t[k].pct}% | ${t[k].covered}/${t[k].total} |`;
            console.log(["### Cobertura do backend", "", "| Metrica | % | Cobertos |", "|---|---|---|",
              ...["lines", "statements", "functions", "branches"].map(row)].join("\n"));
          ' >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: check
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build da imagem (sem push)
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          load: true
          tags: abp4-backend:ci
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Smoke test do container (/health)
        working-directory: .
        run: |
          docker run -d --name api -p 3000:3000 -e APP_VERSION="${GITHUB_SHA::7}" abp4-backend:ci
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:3000/health; then echo; exit 0; fi
            sleep 1
          done
          docker logs api
          exit 1
