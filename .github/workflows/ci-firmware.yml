name: ci-firmware

on:
  # Em PR roda sempre: os checks sao obrigatorios na main.
  pull_request:
  push:
    branches: [main]
    paths:
      - 'firmware/**'
      - '.github/workflows/ci-firmware.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: firmware

jobs:
  build:
    name: ci-firmware-build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - uses: actions/cache@v6
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/platformio.ini') }}
          restore-keys: pio-${{ runner.os }}-

      - name: Instalar PlatformIO
        run: pip install platformio==6.1.18

      - name: Testar intervalos de reconexao
        run: |
          g++ -std=c++11 -Wall -Wextra -Werror -I include tests/test_retry.cpp -o "$RUNNER_TEMP/abp4-test-retry"
          "$RUNNER_TEMP/abp4-test-retry"
          g++ -std=c++11 -Wall -Wextra -Werror -I tests/fakes -I include -I src tests/test_mqtt.cpp src/modules/mqtt.cpp -o "$RUNNER_TEMP/abp4-test-mqtt"
          "$RUNNER_TEMP/abp4-test-mqtt"

      # config.h tem segredos (WiFi/broker) e nao e versionado; no CI compila com o exemplo.
      - name: Preparar config.h a partir do exemplo
        run: cp include/config.example.h include/config.h

      - name: Build
        run: pio run
